# Copy to /etc/nginx/sites-available/hydra and symlink into sites-enabled.
# Replace hydraglobalofficial.com with the VPS hostname.

limit_req_zone $binary_remote_addr zone=hydra:10m rate=10r/s;

server {
  listen 80;
  listen [::]:80;
  server_name hydraglobalofficial.com www.hydraglobalofficial.com;

  client_max_body_size 64m;

  location /media/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 365d;
    add_header Cache-Control "public, immutable";
  }

  location / {
    limit_req zone=hydra burst=40 nodelay;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
